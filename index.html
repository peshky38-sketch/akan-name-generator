<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akan Name Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Akan Name Generator</h1>
    <p class="description">
        Discover your Akan name based on the day you were born. 
        Enter your birth details below and select your gender.
    </p>

    <form id="akanForm">
        <input type="number" id="day" placeholder="Day (1-31)" required>
        <input type="number" id="month" placeholder="Month (1-12)" required>
        <input type="number" id="year" placeholder="Year (e.g. 2005)" required>

        <div class="gender">
            <label>
                <input type="radio" name="gender" value="male"> Male
            </label>
            <label>
                <input type="radio" name="gender" value="female"> Female
            </label>
        </div>

        <button type="submit">Get Akan Name</button>
        <button id="toggleTheme">Toggle Theme</button>
    </form>

    <div id="result"></div>
</div>

<script src="script.js"></script>
</body>
</html>
